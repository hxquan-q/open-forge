# Modified by The Open Forge contributors.
# Docs site: verify affected changes, including built HTTP user flows.
#
# Deployment is configured separately by maintainers. This workflow only
# checks the site; it does not deploy or establish a public production URL.

name: docs-site

on:
  push:
    branches:
      - dev
    paths:
      - "apps/docs-site/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "apps/docs-site/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check + test + build + HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Typecheck
        run: bun run --cwd apps/docs-site check

      - name: Test
        run: bun run --cwd apps/docs-site test

      - name: Build
        run: bun run build:docs

      - name: Test built documentation user flows
        run: bun run --cwd apps/docs-site test:production
